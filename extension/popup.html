<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pitaara Web Clipper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 320px;
      background-color: #09090b;
      color: #f4f4f5;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .logo-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f59e0b, #f43f5e, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.25);
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }
    .subtitle {
      font-size: 10px;
      color: #a1a1aa;
    }
    .target-preview {
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .tab-title {
      font-size: 12px;
      font-weight: 600;
      color: #e4e4e7;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      margin-bottom: 4px;
    }
    .tab-url {
      font-size: 10px;
      color: #71717a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .field {
      margin-bottom: 12px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #d4d4d8;
      margin-bottom: 6px;
    }
    .field input, .field textarea {
      width: 100%;
      background-color: #09090b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: #f4f4f5;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus, .field textarea:focus {
      border-color: #f43f5e;
    }
    .btn {
      width: 100%;
      background: linear-gradient(90deg, #f43f5e, #f59e0b);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.2);
    }
    .btn:hover {
      opacity: 0.92;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      display: none;
    }
    .status-msg.success {
      display: block;
      color: #34d399;
    }
    .status-msg.error {
      display: block;
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">✦</div>
    <div>
      <div class="title">Pitaara Clipper</div>
      <div class="subtitle">Desktop Vault Companion</div>
    </div>
  </div>

  <div class="target-preview">
    <div id="tabTitle" class="tab-title">Loading current page...</div>
    <div id="tabUrl" class="tab-url">https://...</div>
  </div>

  <div class="field">
    <label for="quickImpression">Keepsake Thought / Note</label>
    <input type="text" id="quickImpression" placeholder="Why this matters, takeaway...">
  </div>

  <div class="field" id="quoteField" style="display: none;">
    <label for="selectedText">Selected Quote</label>
    <textarea id="selectedText" rows="3" placeholder="Selected text..."></textarea>
  </div>

  <button id="saveBtn" class="btn">
    <span>Drop into Pitaara</span>
  </button>

  <div id="statusMsg" class="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
